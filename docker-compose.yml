services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 45s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - "./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    # Host 6379 is often taken by another Redis; containers still use host `redis` port 6379.
    ports:
      - "16379:6379"

  reconciliation-engine:
    build: ./backend
    command: ["python", "-m", "services.reconciliation_engine"]
    environment:
      VF_SERVICE_NAME: "reconciliation-engine"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
      VF_MISSING_THRESHOLD_MS: "5000"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  websocket-api:
    build: ./backend
    command: ["python", "-m", "services.websocket_api"]
    environment:
      VF_SERVICE_NAME: "websocket-api"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
      VF_API_HOST: "0.0.0.0"
      VF_API_PORT: "8001"
      VF_AUTOCORRECT_MAX_DELTA: "5"
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8001/health\", timeout=3).read()'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  payment-ingress:
    build: ./backend
    command: ["python", "-m", "services.payment_ingress"]
    environment:
      VF_SERVICE_NAME: "payment-ingress"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_INGEST_HOST: "0.0.0.0"
      VF_INGEST_PORT: "8002"
      VF_INGEST_BEARER_TOKEN: "dev-ingest-token-change-in-prod"
      VF_INGEST_DEFAULT_NODE_ID: "gateway"
    ports:
      - "8002:8002"
    depends_on:
      kafka:
        condition: service_healthy

  merchant-simulator:
    build: ./backend
    command: ["python", "-m", "services.merchant_simulator"]
    environment:
      VF_SERVICE_NAME: "merchant-simulator"
      VF_NODE_ID: "merchant"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
      VF_SIMULATOR_RATE_PER_SEC: "6"
      VF_SIMULATOR_FAULT_PROBABILITY: "0.32"
      VF_SIMULATOR_INJECT_GRACE_MS: "220"
      VF_CRYPTO_FLOW_PROBABILITY: "0.65"
      VF_RAIL_WEIGHT_CARD: "1"
      VF_RAIL_WEIGHT_TRANSFER: "1"
      VF_RAIL_WEIGHT_CRYPTO: "1"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  gateway-simulator:
    build: ./backend
    command: ["python", "-m", "services.gateway_simulator"]
    environment:
      VF_SERVICE_NAME: "gateway-simulator"
      VF_NODE_ID: "gateway"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  crypto-exchange-simulator:
    build: ./backend
    command: ["python", "-m", "services.crypto_exchange_simulator"]
    environment:
      VF_SERVICE_NAME: "crypto-exchange-simulator"
      VF_NODE_ID: "crypto_exchange"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  bank-simulator:
    build: ./backend
    command: ["python", "-m", "services.bank_simulator"]
    environment:
      VF_SERVICE_NAME: "bank-simulator"
      VF_NODE_ID: "bank"
      VF_KAFKA_BOOTSTRAP: "kafka:9092"
      VF_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # Vite dev server proxies /__veriflow → websocket-api (browser stays on :3000 only).
      VERIFLOW_API_PROXY_TARGET: "http://websocket-api:8001"
    ports:
      - "3000:3000"
    depends_on:
      websocket-api:
        condition: service_healthy
